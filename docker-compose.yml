version: '3.8'

services:
  backend:
    image: backend-image:latest
    ports:
      - "7860:7860"
    container_name: backend

  frontend:
    image: frontend-image:latest
    ports:
      - "8501:8501"
    depends_on:
      - backend
    container_name: frontend

networks:
  default:
    name: rental-network